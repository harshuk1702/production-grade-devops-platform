name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: ap-south-1
  ECR_REPOSITORY: devops-demo-api
  ECR_REGISTRY: 592685884777.dkr.ecr.ap-south-1.amazonaws.com
  EKS_CLUSTER: devops-platform

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: application
        run: pytest

      - name: Build Docker image
        run: docker build -t devops-demo-api:ci ./application

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: devops-demo-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /kubeconform
          args: >-
            -summary
            -strict
            -schema-location
            default
            -schema-location
            https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            k8s/rollout.yaml
            k8s/service-stable.yaml
            k8s/service-canary.yaml
            k8s/ingress.yaml
            k8s/prometheusrule.yaml
            k8s/alertmanagerconfig.yaml
            k8s/analysis-template.yaml

      - name: Configure AWS credentials
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::592685884777:role/GitHubActions-EKS-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: aws sts get-caller-identity

      - name: Log in to Amazon ECR
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: aws-actions/amazon-ecr-login@v2

      - name: Tag production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker tag devops-demo-api:ci ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

      - name: Push production image
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        run: |
          docker push ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}

  deploy:
    name: Deploy to EKS
    runs-on: ubuntu-latest
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: arn:aws:iam::592685884777:role/GitHubActions-EKS-Deploy
          aws-region: ${{ env.AWS_REGION }}

      - name: Verify AWS identity
        run: aws sts get-caller-identity

      - name: Update kubeconfig
        run: aws eks update-kubeconfig --region ${{ env.AWS_REGION }} --name ${{ env.EKS_CLUSTER }}

      - name: Verify Kubernetes access
        run: kubectl get pods -n default

      - name: Update Argo Rollout image
        run: |
          sed -i "s#image: .*devops-demo-api:.*#image: ${{ env.ECR_REGISTRY }}/${{ env.ECR_REPOSITORY }}:${{ github.sha }}#" k8s/rollout.yaml
          kubectl apply -f k8s/rollout.yaml

      - name: Wait for Argo Rollout
        run: |
          set -euo pipefail

          expected_image="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          for i in {1..120}; do
            generation="$(kubectl get rollout devops-demo-api -n default -o jsonpath='{.metadata.generation}')"
            observed="$(kubectl get rollout devops-demo-api -n default -o jsonpath='{.status.observedGeneration}')"
            phase="$(kubectl get rollout devops-demo-api -n default -o jsonpath='{.status.phase}')"
            image="$(kubectl get rollout devops-demo-api -n default -o jsonpath='{.spec.template.spec.containers[0].image}')"

            echo "generation=${generation} observed=${observed} phase=${phase} image=${image}"

            if [[ "${generation}" == "${observed}" && "${phase}" == "Healthy" && "${image}" == "${expected_image}" ]]; then
              echo "Rollout is Healthy and running the expected image."
              exit 0
            fi

            sleep 5
          done

          echo "Rollout did not become Healthy with the expected image."
          kubectl describe rollout devops-demo-api -n default
          kubectl get pods -n default -l app=devops-demo-api -o wide
          exit 1

      - name: Verify production rollout
        run: |
          kubectl get rollout devops-demo-api -n default
          kubectl get pods -n default -l app=devops-demo-api -o wide