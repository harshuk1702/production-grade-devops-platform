name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  packages: write

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install dependencies
        working-directory: application
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run tests
        working-directory: application
        run: pytest

      - name: Build Docker image
        run: docker build -t devops-demo-api:ci ./application

      - name: Scan Docker image for vulnerabilities
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          version: v0.74.0
          image-ref: devops-demo-api:ci
          format: table
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          exit-code: "1"

      - name: Validate Kubernetes manifests
        uses: docker://ghcr.io/yannh/kubeconform:latest
        with:
          entrypoint: /kubeconform
          args: >-
            -summary
            -strict
            -schema-location
            default
            -schema-location
            https://raw.githubusercontent.com/datreeio/CRDs-catalog/main/{{.Group}}/{{.ResourceKind}}_{{.ResourceAPIVersion}}.json
            k8s/rollout.yaml
            k8s/service-stable.yaml
            k8s/service-canary.yaml
            k8s/ingress.yaml
            k8s/prometheusrule.yaml
            k8s/alertmanagerconfig.yaml
            k8s/analysis-template.yaml

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Tag Docker image
        run: |
          docker tag devops-demo-api:ci ghcr.io/${{ github.repository_owner }}/devops-demo-api:ci
          docker tag devops-demo-api:ci ghcr.io/${{ github.repository_owner }}/devops-demo-api:${{ github.sha }}

      - name: Push Docker image
        run: |
          docker push ghcr.io/${{ github.repository_owner }}/devops-demo-api:ci
          docker push ghcr.io/${{ github.repository_owner }}/devops-demo-api:${{ github.sha }}

      - name: Verify pushed image
        run: |
          docker manifest inspect ghcr.io/${{ github.repository_owner }}/devops-demo-api:${{ github.sha }}
