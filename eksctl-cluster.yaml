apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: devops-platform
  region: ap-south-1
  version: "1.33"

managedNodeGroups:
  - name: devops-workers
    instanceType: t3.small
    desiredCapacity: 2
    minSize: 1
    maxSize: 2
    volumeSize: 20
    volumeType: gp3
    privateNetworking: false
    amiFamily: AmazonLinux2023

vpc:
  nat:
    gateway: Disable
