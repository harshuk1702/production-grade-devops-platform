apiVersion: monitoring.coreos.com/v1alpha1
kind: AlertmanagerConfig
metadata:
  name: devops-demo-discord
  namespace: monitoring
  labels:
    alertmanagerConfig: devops-demo

spec:
  route:
    receiver: devops-demo-discord
    groupBy:
      - alertname
      - service
    groupWait: 5s
    groupInterval: 10s
    repeatInterval: 1h
    matchers:
      - name: service
        matchType: "="
        value: devops-demo-api

  receivers:
    - name: devops-demo-discord
      discordConfigs:
        - apiURL:
            name: discord-webhook
            key: webhook-url
          sendResolved: true
          title: "DevOps Demo API Alert"
          message: |
            {{ range .Alerts }}
            🚨 **{{ .Labels.alertname }}**

            **Service:** {{ .Labels.service }}
            **Severity:** {{ .Labels.severity }}
            **Summary:** {{ .Annotations.summary }}
            **Description:** {{ .Annotations.description }}
            {{ end }}