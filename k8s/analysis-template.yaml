apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: devops-demo-api-success-rate
  namespace: default
spec:
  metrics:
    - name: success-rate
      interval: 30s
      count: 2
      successCondition: result[0] >= 0.95
      failureLimit: 1
      provider:
        prometheus:
          address: http://monitoring-prometheus-server.monitoring.svc.cluster.local:80
          query: |
            sum(rate(http_requests_total{job="kubernetes-service-endpoints",app="devops-demo-api",path="/",status=~"2.."}[5m]))
            /
            sum(rate(http_requests_total{job="kubernetes-service-endpoints",app="devops-demo-api",path="/"}[5m]))
