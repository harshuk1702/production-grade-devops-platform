apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: github-actions-deploy
  namespace: default
rules:
  - apiGroups:
      - argoproj.io
    resources:
      - rollouts
    verbs:
      - get
      - list
      - watch
      - patch
      - update
  - apiGroups:
      - ""
    resources:
      - pods
    verbs:
      - get
      - list
      - watch
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: github-actions-deploy
  namespace: default
subjects:
  - kind: Group
    name: github-actions-deploy
    apiGroup: rbac.authorization.k8s.io
roleRef:
  kind: Role
  name: github-actions-deploy
  apiGroup: rbac.authorization.k8s.io
