apiVersion: apps/v1
kind: Deployment
metadata:
  name: devops-demo-api
spec:
  replicas: 2

  revisionHistoryLimit: 3

  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1

  selector:
    matchLabels:
      app: devops-demo-api

  template:
    metadata:
      labels:
        app: devops-demo-api

    spec:
      terminationGracePeriodSeconds: 30

      imagePullSecrets:
        - name: ghcr-secret

      containers:
        - name: devops-demo-api
          image: ghcr.io/harshuk1702/devops-demo-api:f7fd3455c1079067c3ec7d640ec06a09519df668

          ports:
            - containerPort: 8000

          env:
            - name: OTEL_SERVICE_NAME
              value: "devops-demo-api"

            - name: OTEL_EXPORTER_OTLP_TRACES_ENDPOINT
              value: "http://tempo.tempo.svc.cluster.local:4318/v1/traces"

          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

          securityContext:
            runAsUser: 10001
            runAsGroup: 10001
            runAsNonRoot: true
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL

          readinessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3

          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 10
            periodSeconds: 20
            timeoutSeconds: 2
            failureThreshold: 3
